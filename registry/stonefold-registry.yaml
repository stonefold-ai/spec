# Stonefold model registry — the declared catalogue the gateway knows about (spec §2,
# design §2). Every resource/action/scope-predicate/hook/check/set/sink that any
# example policy references is declared here, so the linter's §13.1 existence
# check passes. Governance attributes (spec §5) are listed only when they differ
# from the benign defaults (docs/06 §4: danger is declared, never assumed):
# reversibility=reversible, emission=none, operativeForce=none,
# resultSensitivity=internal, explainability=none.
#
# NOTE (dialect): this file is the gateway loader's COMPACT dialect
# (resources/sets/contentHooks, attributes inline). The registry AUTHORING
# format is schema/registry.schema.json + docs/06 (domain/entities/namedSets),
# as used by examples/*.registry.yaml. Same vocabulary, two spellings;
# unification is deferred — docs/03 → "Registry dialects".
#
# A transition action MUST declare its legal `from` states (spec §4.5, §13.3).

connectors: [in_memory, sql, http, email, erp-po-adapter, emr-prescriptions]

scopePredicates:
  - assignedToCurrentUser
  - customerAssignedToCurrentUser
  - inWard
  - forPatientInWard
  - inCompartment
  - tenantOf
  - clientOf
  - forMatterOfClient
  - inEnvironment
  - assignedToQueue

contentHooks:
  - dlp.basic

preconditionChecks:
  - fiveRightsVerified
  - theResourceIsKnownToBeUnused
  # the standard closure check — the gateway supplies it and
  # spec §7.6 defines what it does; declared like any other named check.
  - name: dispositionIsDeclared
    holdCapable: true
    reasonCodes:
      DISPOSITION_REQUIRED:    retryable
      CLOSED_WITHOUT_THE_WORK: escalate
  - notDiscontinued
  - emconAuthorized
  - deconflicted
  - positiveIdentification
  - payeeCoolingOffElapsed
  # the object form — declares hold capability and the
  # retry class of every code the check may emit (docs/06 §5).
  - name: matchesOpenPurchaseOrder
    holdCapable: true
    reasonCodes:
      no-open-match: terminal
      amount-outside-tolerance: retryable
      multiple-candidates: escalate
  - surroundingsClear
  - withinPostedLimit
  - withinTractionLimits

# v0.3 (docs/06 §5b): the systems of record `requireMatch` matches
# against. The schema is a MATCH SURFACE, not a domain model — only the fields
# the example policies compare and consume are declared.
obligationRegistries:
  erp.purchase_orders:                 # payments-ops: the open PO is the obligation
    connector: erp-po-adapter
    capability: transactional
    schema:
      vendorId: { type: string }
      state:    { values: [open, closed, cancelled] }
      vendor:
        properties:
          domain: { type: string }
      line:
        properties:
          amount: { type: decimal }
          state:  { values: [unconsumed, reserved, consumed] }
  emr.prescriptions:                   # healthcare: the prescription is the obligation
    connector: emr-prescriptions
    capability: transactional
    schema:
      patientId: { type: string }
      state:     { values: [active, completed, discontinued] }
      drug:      { type: string }
      route:     { type: string }
      dose:      { type: decimal }
      schedule:
        properties:
          slot:      { type: string }
          slotState: { values: [unconsumed, reserved, consumed] }

sets:
  corporate-domains: [acme.example, acme.test, acme.internal]
  sanctioned-list: [KP, IR, SY, CU]
  approved-court-systems: [ecf-federal, state-superior]
  static-provider-keys: [provider-root-key, org-master-token]

sinks: [careTeam]

resources:
  # --- customer support / business ---
  Customer:
    connector: sql
    actions:
      read: { kind: observe }
      exportData: { kind: effect, reversibility: irreversible }   # alias-ish; real one is Export.exportData
  Order:
    connector: sql
    actions:
      read: { kind: observe }
      confirm: { kind: transition, from: [pending_confirmation] }
      cancel: { kind: transition, from: [pending_confirmation, confirmed] }
      sign: { kind: transition, from: [draft] }   # healthcare: sign a draft order
  Invoice:
    connector: sql
    actions:
      read: { kind: observe }
      send: { kind: transition, from: [draft] }
      markPaid: { kind: transition, from: [sent] }
  Note:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }
  Email:
    connector: email
    actions:
      sendEmail: { kind: effect, reversibility: irreversible }   # a sent email can't be un-sent
  Export:
    connector: in_memory
    actions:
      exportData: { kind: effect, reversibility: irreversible }

  # --- payments / finance ---
  Account:
    connector: sql
    actions:
      read: { kind: observe }
  Payment:
    connector: sql
    actions:
      read: { kind: observe }
      # compensable ⇒ a declared undo MUST exist (spec §5, §13 rule 10). The undo is
      # itself a gated action; expose it to an operator, not the agent (keep it out
      # of the agent's allow-set).
      pay:    { kind: effect, reversibility: compensable, compensation: { resource: Payment, action: refund } }
      refund: { kind: effect, reversibility: compensable, compensation: { resource: Payment, action: pay } }
  Payee:
    connector: sql
    actions:
      read: { kind: observe }
  LedgerEntry:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }

  # --- healthcare ---
  Patient:
    connector: sql
    actions:
      read: { kind: observe }
      readSealed: { kind: observe, resultSensitivity: restricted }
      triage: { kind: assess, explainability: required }
      administer: { kind: effect, reversibility: irreversible, operativeForce: high }
  Medication:
    connector: sql
    actions:
      read: { kind: observe }
      prescribe: { kind: transition, from: [draft] }
  Prescribing:
    connector: in_memory
    actions:
      # irreversible effect with a declared compensation (auto-staged on a failed
      # dispatch, design §8.5 / §9).
      prescribe:
        kind: effect
        reversibility: irreversible
        compensation: { resource: Prescribing, action: discontinue }
      discontinue: { kind: effect, reversibility: irreversible }
  Observation:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }
  Encounter:
    connector: sql
    actions:
      discharge: { kind: transition, from: [admitted] }
  Page:
    connector: email
    actions:
      pageOnCall: { kind: effect, reversibility: irreversible }   # a page can't be un-sent

  # --- defence: air/maritime track operator ---
  Track:
    connector: in_memory
    actions:
      read: { kind: observe, resultSensitivity: confidential }
      identify: { kind: transition, from: [unidentified] }
      designate: { kind: transition, from: [identified] }
      radarSweep: { kind: effect, emission: emits }
      engage: { kind: effect, reversibility: irreversible }
      combatId: { kind: assess, explainability: required }
      collateralEstimate: { kind: assess }
  IntelRecord:
    connector: in_memory
    actions:
      read: { kind: observe, resultSensitivity: secret }
  TrackAnnotation:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }

  # --- cyber-physical: vehicle ---
  Vehicle:
    connector: in_memory
    actions:
      read: { kind: observe }
      update: { kind: record }
      applySpeed: { kind: effect, reversibility: reversible }
      start: { kind: transition, from: [stopped] }
      stop: { kind: transition, from: [moving, idle] }
  Sensor:
    connector: in_memory
    actions:
      read: { kind: observe }

  # --- legal matter ---
  Matter:
    connector: sql
    actions:
      read: { kind: observe }
      engage: { kind: transition, from: [conflict_check] }
      close: { kind: transition, from: [active] }
      deleteMatter: { kind: effect, reversibility: irreversible }
  TimeEntry:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }
  Task:
    connector: sql
    actions:
      read: { kind: observe }
      create: { kind: record }
  Staff:
    connector: sql
    actions:
      read: { kind: observe }
  CourtFiling:
    connector: http
    actions:
      eFile: { kind: effect, reversibility: irreversible }

  # --- platform operations (tested estate) ---
  Alert:
    connector: in_memory
    actions:
      read: { kind: observe }
  Service:
    connector: in_memory
    actions:
      read: { kind: observe }
      restartService: { kind: effect }
      scaleService:   { kind: effect }
  Resource:
    connector: in_memory
    actions:
      read: { kind: observe }
      deleteResource: { kind: effect, reversibility: irreversible }
      clearDeletionProtection: { kind: effect }   # the enabling change
  Deployment:
    connector: in_memory
    actions:
      read: { kind: observe }
      deployRelease: { kind: effect }
      promote:  { kind: transition, from: [staged] }
      rollBack: { kind: transition, from: [promoted] }
  Secret:
    connector: in_memory
    actions:
      readSecret: { kind: effect }
  AccessGrant:
    connector: in_memory
    actions:
      createAccessGrant: { kind: effect }
  Shell:
    connector: in_memory
    actions:
      runShell: { kind: effect, reversibility: irreversible }

  # --- worklist (tested estate) ---
  WorklistItem:
    connector: sql
    actions:
      read: { kind: observe }
      markWorked:
        kind: record
        data:
          itemIds:     { type: array, required: true }
          disposition: { values: [resolved, escalated, referred, duplicate], required: true }
        closure:
          dispositionField: disposition
          claimsCompletion: [resolved]
        items:
          field: itemIds
          independent: true
          maxItems: 200
      deleteItem: { kind: effect, reversibility: irreversible }
  Document:
    connector: sql
    actions:
      read: { kind: observe }

  # --- the INVALID fixture's irreversible effect ---
  Disk:
    connector: in_memory
    actions:
      wipeDisk: { kind: effect, reversibility: irreversible }
